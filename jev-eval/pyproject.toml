[project]
name = "jev-eval"
version = "0.1.0"
description = "Classify banking chat queries into parametrized app actions with TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
jev-eval = "jev_eval:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
